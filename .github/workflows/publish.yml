name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm (trusted publishing)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing — no NPM_TOKEN secret needed

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.23.0
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm CLI >= 11.5.1; the bundled one is older.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Verify tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "publishing spotworkers@$pkg"

      - name: Syntax check
        run: npm run check:syntax

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      - name: Test summary
        if: always()
        run: |
          {
            echo "## Test results"
            echo ""
            echo '```'
            tail -12 test-output.txt 2>/dev/null || echo "no test output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # No NODE_AUTH_TOKEN: npm exchanges the GitHub OIDC token for a short-lived
      # publish credential, and attaches a provenance statement automatically.
      - name: Publish
        run: npm publish --access public
