name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Syntax + tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.23.0]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          # No cache: npm — this project has zero runtime deps and no lockfile.

      - name: Syntax check
        run: npm run check:syntax

      - name: Test
        shell: bash
        # pipefail so a failing test fails this step even though output is teed.
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      - name: Test summary
        if: always()
        run: |
          {
            echo "## Test results"
            echo ""
            echo '```'
            tail -12 test-output.txt 2>/dev/null || echo "no test output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
