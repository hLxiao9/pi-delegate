name: Feature request
description: Suggest a new feature or improvement
title: "[feat]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the current limitation or pain point.
      placeholder: "I'm frustrated when ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like?
      description: Describe the solution you'd like. Concrete CLI / config / behavior is best.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: gates
    attributes:
      label: Does this weaken any hard gate?
      description: pi-delegate's security model depends on independent verification, diff-hash integrity, and the hard gates in SKILL.md.
      options:
        - label: "No, this does not weaken independent verification, diff-hash integrity, or any hard gate"
          required: true
