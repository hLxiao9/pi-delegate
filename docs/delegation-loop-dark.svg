<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 620" width="1760" height="620" role="img" font-family="sans-serif">
  <title>Delegation loop: the parent keeps judgment, the worker only owns the diff</title>
  <desc>Five stages: parent agent defines acceptance, prepare picks a model tier by difficulty, a cheap worker implements, verify re-runs the tests and checks the diff hash, approve merges only when every gate is green. A failed verification loops back to the worker.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 z" fill="#8A8A85"/>
    </marker>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 z" fill="#8A8A85"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1760" height="620" fill="#15171C"/>

  <text x="80" y="104" font-size="26" fill="#A8A8A2">Parent keeps judgment. The worker only owns the diff.</text>

  <g>
    <rect x="80" y="180" width="280" height="144" rx="14" fill="#0B2B45" stroke="#378ADD" stroke-width="2"/>
    <text x="220" y="240" font-size="34" font-weight="600" fill="#B5D4F4" text-anchor="middle">Parent agent</text>
    <text x="220" y="288" font-size="24" fill="#85B7EB" text-anchor="middle">Defines acceptance</text>
  </g>

  <g>
    <rect x="410" y="180" width="280" height="144" rx="14" fill="#0B2B45" stroke="#378ADD" stroke-width="2"/>
    <text x="550" y="240" font-size="34" font-weight="600" fill="#B5D4F4" text-anchor="middle">prepare</text>
    <text x="550" y="288" font-size="24" fill="#85B7EB" text-anchor="middle">Picks model tier</text>
  </g>

  <g>
    <rect x="740" y="180" width="280" height="144" rx="14" fill="#3A2A0A" stroke="#EF9F27" stroke-width="2"/>
    <text x="880" y="240" font-size="34" font-weight="600" fill="#FAC775" text-anchor="middle">cheap worker</text>
    <text x="880" y="288" font-size="24" fill="#EF9F27" text-anchor="middle">Pi · Kimi · Qoder</text>
  </g>

  <g>
    <rect x="1070" y="180" width="280" height="144" rx="14" fill="#0A2E24" stroke="#1D9E75" stroke-width="2"/>
    <text x="1210" y="240" font-size="34" font-weight="600" fill="#9FE1CB" text-anchor="middle">verify</text>
    <text x="1210" y="288" font-size="24" fill="#5DCAA5" text-anchor="middle">Re-runs your tests</text>
  </g>

  <g>
    <rect x="1400" y="180" width="280" height="144" rx="14" fill="#0A2E24" stroke="#1D9E75" stroke-width="2"/>
    <text x="1540" y="240" font-size="34" font-weight="600" fill="#9FE1CB" text-anchor="middle">approve</text>
    <text x="1540" y="288" font-size="24" fill="#5DCAA5" text-anchor="middle">All gates green</text>
  </g>

  <path d="M364 252 H402" stroke="#8A8A85" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <path d="M694 252 H732" stroke="#8A8A85" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <path d="M1024 252 H1062" stroke="#8A8A85" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <path d="M1354 252 H1392" stroke="#8A8A85" stroke-width="3" fill="none" marker-end="url(#a)"/>

  <path d="M1210 328 V432 H880 V334" stroke="#8A8A85" stroke-width="3" fill="none" marker-end="url(#af)"/>
  <text x="1045" y="472" font-size="22" fill="#A8A8A2" text-anchor="middle">verification fails → re-run</text>

  <g>
    <rect x="80" y="534" width="24" height="24" rx="5" fill="#0B2B45" stroke="#378ADD" stroke-width="2"/>
    <text x="118" y="554" font-size="23" fill="#D8D8D2">decides + verifies</text>
    <rect x="390" y="534" width="24" height="24" rx="5" fill="#3A2A0A" stroke="#EF9F27" stroke-width="2"/>
    <text x="428" y="554" font-size="23" fill="#D8D8D2">untrusted execution</text>
    <rect x="720" y="534" width="24" height="24" rx="5" fill="#0A2E24" stroke="#1D9E75" stroke-width="2"/>
    <text x="758" y="554" font-size="23" fill="#D8D8D2">hard gates</text>
  </g>
</svg>
