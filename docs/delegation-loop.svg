<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 620" width="1760" height="620" role="img" font-family="sans-serif">
  <title>Delegation loop: the parent keeps judgment, the worker only owns the diff</title>
  <desc>Five stages: parent agent defines acceptance, prepare picks a model tier by difficulty, a cheap worker implements, verify re-runs the tests and checks the diff hash, approve merges only when every gate is green. A failed verification loops back to the worker.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 z" fill="#888780"/>
    </marker>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 z" fill="#888780"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1760" height="620" fill="#FBFBFA"/>

  <text x="80" y="104" font-size="26" fill="#5F5E5A">Parent keeps judgment. The worker only owns the diff.</text>

  <g>
    <rect x="80" y="180" width="280" height="144" rx="14" fill="#E6F1FB" stroke="#378ADD" stroke-width="2"/>
    <text x="220" y="240" font-size="34" font-weight="600" fill="#0C447C" text-anchor="middle">Parent agent</text>
    <text x="220" y="288" font-size="24" fill="#185FA5" text-anchor="middle">Defines acceptance</text>
  </g>

  <g>
    <rect x="410" y="180" width="280" height="144" rx="14" fill="#E6F1FB" stroke="#378ADD" stroke-width="2"/>
    <text x="550" y="240" font-size="34" font-weight="600" fill="#0C447C" text-anchor="middle">prepare</text>
    <text x="550" y="288" font-size="24" fill="#185FA5" text-anchor="middle">Picks model tier</text>
  </g>

  <g>
    <rect x="740" y="180" width="280" height="144" rx="14" fill="#FAEEDA" stroke="#EF9F27" stroke-width="2"/>
    <text x="880" y="240" font-size="34" font-weight="600" fill="#633806" text-anchor="middle">cheap worker</text>
    <text x="880" y="288" font-size="24" fill="#854F0B" text-anchor="middle">Pi · Kimi · Qoder</text>
  </g>

  <g>
    <rect x="1070" y="180" width="280" height="144" rx="14" fill="#E1F5EE" stroke="#1D9E75" stroke-width="2"/>
    <text x="1210" y="240" font-size="34" font-weight="600" fill="#04342C" text-anchor="middle">verify</text>
    <text x="1210" y="288" font-size="24" fill="#0F6E56" text-anchor="middle">Re-runs your tests</text>
  </g>

  <g>
    <rect x="1400" y="180" width="280" height="144" rx="14" fill="#E1F5EE" stroke="#1D9E75" stroke-width="2"/>
    <text x="1540" y="240" font-size="34" font-weight="600" fill="#04342C" text-anchor="middle">approve</text>
    <text x="1540" y="288" font-size="24" fill="#0F6E56" text-anchor="middle">All gates green</text>
  </g>

  <path d="M364 252 H402" stroke="#888780" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <path d="M694 252 H732" stroke="#888780" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <path d="M1024 252 H1062" stroke="#888780" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <path d="M1354 252 H1392" stroke="#888780" stroke-width="3" fill="none" marker-end="url(#a)"/>

  <path d="M1210 328 V432 H880 V334" stroke="#888780" stroke-width="3" fill="none" marker-end="url(#af)"/>
  <text x="1045" y="472" font-size="22" fill="#5F5E5A" text-anchor="middle">verification fails → re-run</text>

  <g>
    <rect x="80" y="534" width="24" height="24" rx="5" fill="#E6F1FB" stroke="#378ADD" stroke-width="2"/>
    <text x="118" y="554" font-size="23" fill="#2C2C2A">decides + verifies</text>
    <rect x="390" y="534" width="24" height="24" rx="5" fill="#FAEEDA" stroke="#EF9F27" stroke-width="2"/>
    <text x="428" y="554" font-size="23" fill="#2C2C2A">untrusted execution</text>
    <rect x="720" y="534" width="24" height="24" rx="5" fill="#E1F5EE" stroke="#1D9E75" stroke-width="2"/>
    <text x="758" y="554" font-size="23" fill="#2C2C2A">hard gates</text>
  </g>
</svg>
